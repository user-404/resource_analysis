apiVersion: v1
kind: Namespace
metadata:
  name: resource-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-memory-demo
  namespace: resource-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpu-memory-demo
  template:
    metadata:
      labels:
        app: cpu-memory-demo
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c", "yes > /dev/null"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cpu-cron-demo
  namespace: resource-demo
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: cpu-cron-demo
        spec:
          restartPolicy: Never
          containers:
            - name: short-load
              image: busybox:1.36
              command: ["/bin/sh", "-c", "yes > /dev/null & load_pid=$!; sleep 45; kill $load_pid"]
              resources:
                requests:
                  cpu: 100m
                  memory: 32Mi
                limits:
                  cpu: 300m
                  memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: resource-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: http
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              python -c 'import http.server; data=bytearray(16*1024*1024); [data.__setitem__(i,1) for i in range(0,len(data),4096)]; http.server.HTTPServer(("0.0.0.0",8080),http.server.SimpleHTTPRequestHandler).serve_forever()' &
              while true; do
                i=0
                while [ "$i" -lt 5000 ]; do i=$((i+1)); done
                sleep 0.1
              done
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: resource-demo
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: resource-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: http
          image: python:3.12-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              python -c 'import http.server; data=bytearray(24*1024*1024); [data.__setitem__(i,1) for i in range(0,len(data),4096)]; http.server.HTTPServer(("0.0.0.0",8080),http.server.SimpleHTTPRequestHandler).serve_forever()' &
              while true; do
                i=0
                while [ "$i" -lt 8000 ]; do i=$((i+1)); done
                sleep 0.1
              done
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 75m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 160Mi
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: resource-demo
spec:
  selector:
    app: catalog-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-generator
  namespace: resource-demo
spec:
  schedule: "*/3 * * * *"
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: report-generator
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - "yes > /dev/null & load_pid=$!; sleep 60; kill $load_pid"
              resources:
                requests:
                  cpu: 100m
                  memory: 32Mi
                limits:
                  cpu: 300m
                  memory: 64Mi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cleanup-worker
  namespace: resource-demo
spec:
  schedule: "1-59/5 * * * *"
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: cleanup-worker
        spec:
          restartPolicy: Never
          containers:
            - name: cleanup
              image: busybox:1.36
              command:
                - /bin/sh
                - -c
                - "yes > /dev/null & load_pid=$!; sleep 30; kill $load_pid"
              resources:
                requests:
                  cpu: 75m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 64Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: initial-index-build
  namespace: resource-demo
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: initial-index-build
    spec:
      restartPolicy: Never
      containers:
        - name: index-build
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "yes > /dev/null & load_pid=$!; sleep 90; kill $load_pid"
          resources:
            requests:
              cpu: 100m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
